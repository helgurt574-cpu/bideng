name: Release

# Windows (.msi/.exe), macOS Apple Silicon ve Intel (.dmg) ve Linux (.deb) kurulum paketlerini
# her sistemin kendi makinesinde üretir ve GitHub Release'e koyar.
# Tüm sesler ve sherpa-onnx pakete gömülür: kurulan uygulama tamamen çevrimdışı çalışır.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Sürüm (ör. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  desktop:
    name: Masaüstü (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: windows
            tasks: packageMsi packageExe
          - name: macOS Apple Silicon
            os: macos-15
            target: macos
            tasks: packageDmg
            dmg: macos-apple-silicon
          # macos-13 GitHub'da kaldırıldı; Intel (x86_64) için tek seçenek macos-15-intel.
          # Üretilen paket macOS 13 Ventura'da da açılır (minimum sürüm aşağıda denetlenir).
          - name: macOS Intel
            os: macos-15-intel
            target: macos-intel
            tasks: packageDmg
            dmg: macos-intel
          - name: Linux
            os: ubuntu-22.04
            target: linux
            tasks: createDistributable
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sürüm numarası
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: İndirme önbelleği (sesler, sherpa-onnx)
        uses: actions/cache@v4
        with:
          path: filiz-desktop/build/download-cache
          key: tts-${{ matrix.target }}-${{ hashFiles('filiz-desktop/tools/prepare_app_resources.py') }}

      - name: Gömülü sesleri ve sherpa-onnx'i hazırla
        run: python filiz-desktop/tools/prepare_app_resources.py ${{ matrix.target }}

      - name: macOS — yerel kütüphaneleri ad-hoc imzala
        if: startsWith(matrix.target, 'macos')
        run: codesign --force --sign - filiz-desktop/build/app-resources/macos/sherpa-native/*.dylib

      - name: Ses denemesi (5 ses; Türkçe, Arapça, Farsça)
        run: python filiz-desktop/tools/prepare_app_resources.py ${{ matrix.target }} --smoke-only

      - name: Paketle
        working-directory: filiz-desktop
        run: ./gradlew --no-daemon --console=plain ${{ matrix.tasks }} -PbidengVersion="$VERSION"

      - name: macOS — mimari ve en düşük macOS sürümü
        if: startsWith(matrix.target, 'macos')
        run: |
          APP=$(find filiz-desktop/build/compose/binaries/main -maxdepth 3 -name Bideng.app -type d | head -1)
          [ -z "$APP" ] && { hdiutil attach filiz-desktop/build/compose/binaries/main/dmg/*.dmg -mountpoint /Volumes/Bideng -nobrowse; APP=/Volumes/Bideng/Bideng.app; }
          WANT=arm64; [ "${{ matrix.target }}" = macos-intel ] && WANT=x86_64
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist" || true
          bad=0
          while read -r f; do
            archs=$(lipo -archs "$f" 2>/dev/null) || continue
            minos=$(otool -l "$f" | awk '/LC_BUILD_VERSION/{b=1} b&&/minos/{print $2; exit} /LC_VERSION_MIN_MACOSX/{v=1} v&&/version/{print $2; exit}' || true)
            echo "$archs  minos=$minos  ${f#$APP/}"
            case " $archs " in *" $WANT "*) ;; *) echo "::error::$WANT değil: $f"; bad=1 ;; esac
            if [ -n "$minos" ] && [ "$(printf '%s\n' "$minos" 13.0 | sort -V | tail -1)" != 13.0 ] && [ "$minos" != 13.0 ]; then
              echo "::error::macOS 13'te çalışmaz (minos $minos): $f"; bad=1
            fi
          done < <(find "$APP" -type f \( -perm -u+x -o -name '*.dylib' -o -name '*.jnilib' \))
          [ -d /Volumes/Bideng ] && hdiutil detach /Volumes/Bideng || true
          exit $bad

      - name: Linux — .deb oluştur
        if: matrix.target == 'linux'
        run: |
          mkdir -p dist
          filiz-desktop/tools/build_deb.sh filiz-desktop/build/compose/binaries/main/app/Bideng "$VERSION" "dist/Bideng-$VERSION-linux-amd64.deb"

      - name: Linux — AppImage oluştur
        if: matrix.target == 'linux'
        run: |
          APPDIR="$RUNNER_TEMP/Bideng.AppDir"
          rm -rf "$APPDIR" && mkdir -p "$APPDIR"
          cp -a filiz-desktop/build/compose/binaries/main/app/Bideng/. "$APPDIR/"
          cp filiz-desktop/src/desktopMain/resources/icons/bideng.png "$APPDIR/bideng.png"
          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/bin/Bideng" "$@"
          APPRUN
          sed -i 's/^          //' "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=Bideng' \
            'Comment=Çevrimdışı sesli belge okuyucu' 'Exec=Bideng' 'Icon=bideng' \
            'Categories=Office;Education;' 'Terminal=false' 'StartupWMClass=com-example-filiz-desktop-MainKt' > "$APPDIR/bideng.desktop"
          curl -sL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          mkdir -p dist
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 "$RUNNER_TEMP/appimagetool" "$APPDIR" "dist/Bideng-$VERSION-linux-x86_64.AppImage"
          ls -la dist

      - name: Dosya adlarını düzenle
        run: |
          mkdir -p dist
          find filiz-desktop/build/compose/binaries -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' \) | while read -r f; do
            case "$f" in
              *.msi) cp "$f" "dist/Bideng-$VERSION-windows-x64.msi" ;;
              *.exe) cp "$f" "dist/Bideng-$VERSION-windows-x64-setup.exe" ;;
              *.dmg) cp "$f" "dist/Bideng-$VERSION-${{ matrix.dmg }}.dmg" ;;
            esac
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: bideng-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1  # dosyalar Release'e konuyor; Actions depolama kotası dolmasın

  release:
    name: GitHub Release
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release oluştur / güncelle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          TAG="v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Bideng $VERSION" --notes-file .github/release-notes.md
          fi
          gh release upload "$TAG" dist/* --clobber
