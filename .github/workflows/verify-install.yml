name: Kurulum denemesi

# Release'teki paketleri gerçek makinelerde kurar ve kontrol eder:
# kurulum başarılı mı, sesler kurulum klasöründe mi, kurulu dosyalarla ses üretiliyor mu, uygulama açılıyor mu.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release etiketi"
        required: true
        default: "v1.0.0"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Paketleri indir
        shell: bash
        run: gh release download "${{ inputs.tag }}" --pattern "*windows*" --dir dl && ls -la dl
      - name: setup.exe ile sessiz kurulum
        shell: pwsh
        run: |
          $exe = Get-ChildItem dl -Filter *setup.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList '/quiet','/norestart' -PassThru
          if (-not $p.WaitForExit(600000)) { $p.Kill(); throw "setup.exe 10 dakikada bitmedi (sessiz kurulumu desteklemiyor olabilir)" }
          "setup.exe çıkış kodu: $($p.ExitCode)"
          Get-ChildItem "C:\Program Files" -Filter "Bideng*" | Format-Table FullName
      - name: setup.exe olmadıysa MSI ile kur
        shell: pwsh
        run: |
          if (-not (Get-ChildItem "C:\Program Files", "$env:LOCALAPPDATA" -Recurse -Filter Bideng.exe -ErrorAction SilentlyContinue)) {
            $msi = Get-ChildItem dl -Filter *.msi | Select-Object -First 1
            $p = Start-Process msiexec -ArgumentList '/i', "`"$($msi.FullName)`"", '/qn', '/l*v', 'msi.log' -Wait -PassThru
            "msiexec çıkış kodu: $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { Get-Content msi.log -Tail 60; throw "MSI kurulumu başarısız" }
          }
      - name: Kurulan dosyalar ve gömülü sesler
        shell: pwsh
        run: |
          $app = Get-ChildItem "C:\Program Files", "$env:LOCALAPPDATA" -Recurse -Filter Bideng.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw "Bideng.exe bulunamadı" }
          $root = $app.Directory.FullName
          "Kurulum klasörü: $root"
          $models = Get-ChildItem $root -Recurse -Filter model.onnx
          $models | ForEach-Object { "{0}  {1:N0} MB" -f $_.FullName, ($_.Length / 1MB) }
          if ($models.Count -lt 5) { throw "5 ses modeli bekleniyordu, bulunan: $($models.Count)" }
          $res = $models[0].Directory.Parent.Parent.FullName
          "RES=$res" | Out-File -Append $env:GITHUB_ENV
          "APPEXE=$($app.FullName)" | Out-File -Append $env:GITHUB_ENV
      - name: Kurulu seslerle ses üret (Türkçe ğşıİ, Arapça, Farsça)
        shell: pwsh
        run: java -cp filiz-desktop/libs/sherpa-onnx-jvm-1.13.8.jar "-Dsherpa_onnx.native.path=$env:RES\sherpa-native" "-Dstdout.encoding=UTF-8" filiz-desktop/tools/TtsSmokeTest.java "$env:RES\tts"
      - name: Uygulamayı başlat
        shell: pwsh
        run: |
          $p = Start-Process $env:APPEXE -PassThru
          Start-Sleep 30
          if ($p.HasExited) { throw "Bideng 30 saniye içinde kapandı (çıkış kodu $($p.ExitCode))" }
          "Bideng çalışıyor (PID $($p.Id))"
          Stop-Process $p.Id -Force

  linux:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Paketleri indir
        run: gh release download "${{ inputs.tag }}" --pattern "*linux*" --dir dl && ls -la dl
      - name: .deb kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./dl/*.deb xvfb
          dpkg -L bideng | grep -E "model.onnx|bin/Bideng|\.desktop"
          find /opt/bideng -name model.onnx | wc -l | grep -qx 5
      - name: Kurulu seslerle ses üret (.deb)
        run: |
          R=/opt/bideng/lib/app/resources
          java -cp filiz-desktop/libs/sherpa-onnx-jvm-1.13.8.jar -Dsherpa_onnx.native.path=$R/sherpa-native filiz-desktop/tools/TtsSmokeTest.java $R/tts
      - name: Uygulamayı başlat (.deb)
        run: |
          set +e
          xvfb-run -a timeout 30 /opt/bideng/bin/Bideng > app.log 2>&1
          code=$?
          tail -20 app.log
          [ $code -eq 124 ] && echo "Bideng 30 saniye çalıştı" || { echo "Bideng erken kapandı: $code"; exit 1; }
      - name: AppImage — içerik ve başlatma
        run: |
          chmod +x dl/*.AppImage
          cd dl && ./*.AppImage --appimage-extract >/dev/null && cd ..
          find dl/squashfs-root -name model.onnx | wc -l | grep -qx 5
          ls dl/squashfs-root/AppRun dl/squashfs-root/bideng.desktop dl/squashfs-root/bideng.png
          set +e
          xvfb-run -a timeout 30 ./dl/*.AppImage --appimage-extract-and-run > appimage.log 2>&1
          code=$?
          tail -20 appimage.log
          [ $code -eq 124 ] && echo "AppImage 30 saniye çalıştı" || { echo "AppImage erken kapandı: $code"; exit 1; }

  macos:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Paketi indir ve kur
        run: |
          gh release download "${{ inputs.tag }}" --pattern "*.dmg" --dir dl
          hdiutil attach dl/*.dmg -mountpoint /Volumes/Bideng -nobrowse
          cp -R /Volumes/Bideng/Bideng.app /Applications/
          hdiutil detach /Volumes/Bideng
          find /Applications/Bideng.app -name model.onnx | wc -l | grep -qx 5
      - name: Kurulu seslerle ses üret
        run: |
          R=/Applications/Bideng.app/Contents/app/resources
          ls "$R"
          java -cp filiz-desktop/libs/sherpa-onnx-jvm-1.13.8.jar -Dsherpa_onnx.native.path=$R/sherpa-native filiz-desktop/tools/TtsSmokeTest.java $R/tts
      - name: Uygulamayı başlat
        run: |
          /Applications/Bideng.app/Contents/MacOS/Bideng > app.log 2>&1 &
          PID=$!
          sleep 30
          tail -20 app.log
          kill -0 $PID && echo "Bideng 30 saniye çalıştı" && kill $PID
